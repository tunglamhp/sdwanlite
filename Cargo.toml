[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/lb",
    "crates/mesh",
    "crates/bgp",
    "crates/acme",
    "crates/app",
]
exclude = ["crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"

[profile.release]
lto = true
strip = true
