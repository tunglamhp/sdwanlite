<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SDWANLite logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset=".5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d2ff"/>
      <stop offset="1" stop-color="#3a7bd5"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>

  <!-- central hub node -->
  <circle cx="256" cy="236" r="58" fill="none" stroke="url(#flow)" stroke-width="14"/>
  <circle cx="256" cy="236" r="22" fill="url(#flow)"/>

  <!-- spokes to edge nodes -->
  <g stroke="url(#flow)" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="178" x2="256" y2="118"/>
    <line x1="212" y1="263" x2="150" y2="300"/>
    <line x1="300" y1="263" x2="362" y2="300"/>
  </g>

  <!-- edge nodes -->
  <g fill="#7ee8fa">
    <circle cx="256" cy="104" r="20"/>
    <circle cx="136" cy="310" r="20"/>
    <circle cx="376" cy="310" r="20"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="412" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="64"
        font-weight="700" letter-spacing="2" fill="#eaf6ff">SDWAN</text>
  <text x="256" y="462" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="40"
        font-weight="600" letter-spacing="14" fill="#00d2ff">LITE</text>
</svg>
