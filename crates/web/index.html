<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sdwanlite — control panel</title>
  <style>
:root {
  --bg:#0b0f14; --panel:#12181f; --panel2:#171e27; --border:#232b36;
  --text:#e6edf3; --muted:#8b98a5; --hover:#182130;
  --accent:#00d2ff; --green:#34d399; --red:#f87171; --amber:#fbbf24;
}
[data-theme="light"] {
  --bg:#f2f5f9; --panel:#ffffff; --panel2:#f7f9fc; --border:#dde4ec;
  --text:#1a2330; --muted:#5c6b7c; --hover:#eef3f8; --accent:#0e7fd6;
}
* { box-sizing:border-box; margin:0; }
body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; transition:background .25s,color .25s; }
.wrap { max-width:1240px; margin:auto; padding:20px clamp(14px,3vw,40px); }
header { display:flex; align-items:center; gap:14px; padding:6px 0 14px; }
.logo { width:46px; height:46px; border-radius:12px; background:linear-gradient(135deg,#0f2027,#2c5364);
  display:grid; place-items:center; color:#00d2ff; font-weight:800; font-size:18px; }
h1 { font-size:19px; font-weight:700; }
h1 small { display:block; color:var(--muted); font-size:10px; letter-spacing:3px; font-weight:600; }
.spacer { flex:1; }
.live { display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted); }
.live-dot { width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulse 1.6s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.5)} 50%{box-shadow:0 0 0 6px rgba(52,211,153,0)} }
.icon-btn { background:none; border:1px solid var(--border); border-radius:8px; width:34px; height:34px;
  cursor:pointer; font-size:15px; color:var(--text); display:grid; place-items:center; }
.icon-btn:hover { border-color:var(--accent); }
nav { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; overflow-x:auto; }
nav button { background:none; border:none; color:var(--muted); padding:10px 15px; font-size:13.5px;
  font-weight:600; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
nav button:hover { color:var(--text); }
nav button.active { color:var(--accent); border-bottom-color:var(--accent); }
.view { animation:fadein .25s ease; }
@keyframes fadein { from{opacity:0;transform:translateY(4px)} to{opacity:1} }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:18px; }
.kpi { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
.kpi:hover { border-color:var(--accent); }
.kpi .label { font-size:10.5px; letter-spacing:1.3px; text-transform:uppercase; color:var(--muted); }
.kpi .value { font-size:24px; font-weight:700; margin-top:5px; }
.kpi .sub { font-size:11.5px; color:var(--muted); margin-top:3px; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
.card h3 { font-size:12px; letter-spacing:1.4px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media(max-width:820px){ .grid2{grid-template-columns:1fr} }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; color:var(--muted); font-weight:600; font-size:10.5px; letter-spacing:1px;
  text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--border); }
td { padding:7px 8px; border-bottom:1px solid var(--border); }
tr:last-child td { border-bottom:none; } tr:hover td { background:var(--hover); }
.mono { font-family:Consolas,monospace; font-size:12px; color:var(--accent); }
.pill { display:inline-flex; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; }
.pill.ok{background:rgba(52,211,153,.13);color:var(--green)}
.pill.bad{background:rgba(248,113,113,.13);color:var(--red)}
.pill.warn{background:rgba(251,191,36,.13);color:var(--amber)}
.pill.info{background:rgba(88,166,255,.13);color:var(--accent)}
[data-theme="light"] .pill.ok{background:#d8f5e8} [data-theme="light"] .pill.bad{background:#fde2e2}
[data-theme="light"] .pill.warn{background:#fdf1d6} [data-theme="light"] .pill.info{background:#ddeffd}
.btn { background:var(--panel2); color:var(--accent); border:1px solid var(--border); border-radius:8px;
  padding:6px 14px; cursor:pointer; font-size:12.5px; font-weight:600; }
.btn:hover { border-color:var(--accent); }
.btn.danger { color:var(--red); }
pre.keys { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px;
  font-size:12px; color:var(--accent); white-space:pre-wrap; font-family:Consolas,monospace; margin-top:10px; }
#topo-svg { width:100%; height:520px; background:var(--bg); border:1px solid var(--border);
  border-radius:10px; cursor:grab; touch-action:none; user-select:none; }
#topo-svg:active { cursor:grabbing; }
.topo-toolbar { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
.topo-toolbar .lbl { color:var(--muted); font-size:12px; margin-right:4px; }
.topo-node { cursor:grab; }
.topo-node text { pointer-events:none; }
.actions-bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.act-btn { background:var(--panel2); border:1px solid var(--border); border-radius:10px; color:var(--text);
  padding:10px 18px; cursor:pointer; font-weight:600; font-size:13px; transition:all .15s; }
.act-btn:hover { border-color:var(--accent); color:var(--accent); }
.form-row { display:flex; gap:8px; flex-wrap:wrap; align-items:end; margin-top:10px; }
.form-row label { font-size:11px; color:var(--muted); display:block; margin-bottom:3px; }
.form-row input, .form-row select { background:var(--bg); border:1px solid var(--border); color:var(--text);
  border-radius:6px; padding:6px 8px; font-size:12.5px; }
.act-list-item { display:flex; justify-content:space-between; align-items:center;
  padding:6px 0; border-bottom:1px solid var(--border); font-size:13px; }
.toast { position:fixed; bottom:20px; right:20px; background:var(--panel); border:1px solid var(--accent);
  border-radius:10px; padding:12px 18px; font-size:13px; max-width:420px;
  box-shadow:0 8px 30px rgba(0,0,0,.35); z-index:100; animation:fadein .2s ease; }
.kv-row { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; }
.kv-row .k { color:var(--muted); }
footer { text-align:center; color:var(--muted); font-size:12px; margin-top:26px; }
canvas#sparkline { width:100%; height:56px; display:block; }

</style>
</head>
<body>
  <div id="main"></div>
</body>
</html>
