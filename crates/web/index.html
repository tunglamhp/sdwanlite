<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sdwanlite — control panel</title>
  <style>
/* sdwanlite — warm cream / ivory, easy on the eyes */
:root {
  --bg:#FAF6EE; --bg2:#F5F0E1; --panel:#FFFEF9; --panel2:#F5F0E1; --border:#E4DCC8;
  --text:#3E362E; --muted:#8A7E6E; --hover:#F0EBDD;
  --primary:#4A7C59; --primary-light:#6B9B78; --accent:#5C8A5E;
  --green:#4A7C59; --red:#C05040; --amber:#C49A30;
  --sidebar-bg:#2C2A24; --sidebar-hover:#3A382E; --sidebar-active:#4A4838;
  --sidebar-text:#C4B8A8; --sidebar-text-active:#FAF6EE;
  --radius:12px;
}
[data-theme="dark"] {
  --bg:#1C1917; --bg2:#221E1A; --panel:#292421; --panel2:#1E1B18; --border:#3D362E;
  --text:#E8E0D4; --muted:#A0917E; --hover:#332E28;
  --primary:#6B9B78; --primary-light:#8FBC9A; --accent:#7CB89A;
  --green:#6B9B78; --red:#E07A6A; --amber:#D4A855;
  --sidebar-bg:#161412; --sidebar-hover:#221E1A; --sidebar-active:#2C2822;
  --sidebar-text:#A0917E; --sidebar-text-active:#E8E0D4;
}
* { box-sizing:border-box; margin:0; }
body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; transition:background .3s,color .3s; }
.layout { display:flex; min-height:100vh; }

/* ---- Sidebar ---- */
.sidebar { width:230px; flex:none; background:var(--sidebar-bg); display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto; }
.sidebar-header { padding:20px 16px 16px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid rgba(255,255,255,.06); }
.sidebar-logo { width:38px; height:38px; border-radius:10px;
  background:linear-gradient(135deg,#4A7C59,#6B9B78);
  display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px;
  box-shadow:0 2px 8px rgba(74,124,89,.3); }
.sidebar-header b { color:#FAF6EE; font-size:15px; display:block; }
.sidebar-header small { display:block; color:var(--sidebar-text); font-size:9px; letter-spacing:2px; }
.sidebar-nav { flex:1; padding:12px 0; }
.sidebar-nav button { display:flex; align-items:center; gap:10px; width:100%; padding:11px 20px;
  background:none; border:none; color:var(--sidebar-text); font-size:13.5px; font-weight:500;
  cursor:pointer; text-align:left; transition:all .15s; border-left:3px solid transparent;
  border-radius:0 8px 8px 0; }
.sidebar-nav button:hover { background:var(--sidebar-hover); color:var(--sidebar-text-active); }
.sidebar-nav button.active { background:var(--sidebar-active); color:var(--sidebar-text-active); border-left-color:var(--primary-light); }
.sidebar-nav .icon { font-size:16px; width:22px; text-align:center; flex:none; }
.sidebar-footer { padding:14px 16px; border-top:1px solid rgba(255,255,255,.06);
  display:flex; align-items:center; justify-content:space-between; }
.sidebar-footer .live { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--sidebar-text); }
.live-dot { width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulse 1.6s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(74,124,89,.4)} 50%{box-shadow:0 0 0 5px rgba(74,124,89,0)} }
.icon-btn { background:none; border:1px solid rgba(255,255,255,.15); border-radius:7px; width:30px; height:30px;
  cursor:pointer; font-size:14px; color:var(--sidebar-text); display:grid; place-items:center; }
.icon-btn:hover { border-color:var(--primary-light); color:#fff; }

/* ---- Main ---- */
.main { flex:1; padding:24px clamp(16px,3vw,36px); overflow-y:auto; }
.main-header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
.main-header h2 { font-size:20px; font-weight:700; }
.spacer { flex:1; }

.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:20px; }
.kpi { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; border-left:3px solid var(--primary);
  transition:box-shadow .2s,transform .15s; box-shadow:0 1px 4px rgba(62,54,46,.06); }
.kpi:hover { box-shadow:0 4px 14px rgba(62,54,46,.1); transform:translateY(-2px); }
.kpi .label { font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); font-weight:600; }
.kpi .value { font-size:22px; font-weight:700; margin-top:4px; }
.kpi .sub { font-size:11px; color:var(--muted); margin-top:2px; }

.card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(62,54,46,.05); }
.card h3 { font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted);
  margin-bottom:10px; font-weight:700; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media(max-width:860px){ .grid2{grid-template-columns:1fr} }

table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; color:var(--muted); font-weight:600; font-size:10px; letter-spacing:1px;
  text-transform:uppercase; padding:6px 8px; border-bottom:2px solid var(--border); }
td { padding:8px; border-bottom:1px solid var(--border); }
tr:last-child td { border-bottom:none; } tr:hover td { background:var(--hover); }
.mono { font-family:Consolas,monospace; font-size:12px; color:var(--primary); }
.pill { display:inline-flex; padding:2px 9px; border-radius:999px; font-size:10.5px; font-weight:700; }
.pill.ok{background:#e6f2e6;color:var(--green)}
.pill.bad{background:#fbe8e4;color:var(--red)}
.pill.warn{background:#faf0d6;color:var(--amber)}
.pill.info{background:#e8e4f0;color:#6B5E8A}
[data-theme="dark"] .pill.ok{background:#1a2d1a}
[data-theme="dark"] .pill.bad{background:#2a1a1a}
[data-theme="dark"] .pill.warn{background:#2a241a}
[data-theme="dark"] .pill.info{background:#1a1a2a}

.btn { background:var(--panel2); color:var(--primary); border:1px solid var(--border);
  border-radius:8px; padding:6px 14px; cursor:pointer; font-size:12px; font-weight:600;
  transition:all .15s; }
.btn:hover { border-color:var(--primary); background:var(--hover); }
.btn.danger { color:var(--red); }
pre.keys { background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:10px;
  font-size:12px; color:var(--primary); white-space:pre-wrap; font-family:Consolas,monospace; margin-top:10px; }

/* ---- Topology ---- */
#topo-svg { width:100%; height:520px; background:var(--bg2); border:1px solid var(--border);
  border-radius:10px; cursor:grab; touch-action:none; user-select:none; }
#topo-svg:active { cursor:grabbing; }
.topo-toolbar { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
.topo-toolbar .lbl { color:var(--muted); font-size:12px; margin-right:4px; }
.topo-node { cursor:grab; transition:transform .15s ease; }
.topo-node text { pointer-events:none; }
.topo-node:hover rect { stroke-width:2.5; }

/* ---- Actions ---- */
.actions-bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.act-btn { background:var(--panel2); border:1px solid var(--border); border-radius:10px; color:var(--text);
  padding:10px 18px; cursor:pointer; font-weight:600; font-size:13px; transition:all .15s;
  box-shadow:0 1px 3px rgba(62,54,46,.06); }
.act-btn:hover { border-color:var(--primary); color:var(--primary); box-shadow:0 2px 8px rgba(74,124,89,.1); }
.form-row { display:flex; gap:8px; flex-wrap:wrap; align-items:end; margin-top:10px; }
.form-row label { font-size:11px; color:var(--muted); display:block; margin-bottom:3px; font-weight:500; }
.form-row input, .form-row select { background:var(--panel); border:1px solid var(--border); color:var(--text);
  border-radius:8px; padding:7px 10px; font-size:13px; }
.act-list-item { display:flex; justify-content:space-between; align-items:center;
  padding:6px 0; border-bottom:1px solid var(--border); font-size:13px; }
.toast { position:fixed; bottom:20px; right:20px; background:var(--panel); border:1px solid var(--primary);
  border-radius:10px; padding:12px 18px; font-size:13px; max-width:420px;
  box-shadow:0 8px 30px rgba(62,54,46,.12); z-index:100; animation:slidein .25s ease; }
@keyframes slidein { from{transform:translateX(30px);opacity:0} to{transform:translateX(0);opacity:1} }
.kv-row { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; }
.kv-row .k { color:var(--muted); }
footer { text-align:center; color:var(--muted); font-size:11px; margin-top:20px; padding-bottom:12px; }
svg.spark { width:100%; height:56px; }

/* ---- Modal ---- */
.modal-overlay { position:fixed; inset:0; background:rgba(62,54,46,.4); z-index:200;
  display:grid; place-items:center; animation:fadein .15s ease; }
.modal { background:var(--panel); border:1px solid var(--border); border-radius:14px;
  padding:24px; max-width:560px; width:90%; max-height:80vh; overflow-y:auto;
  box-shadow:0 12px 40px rgba(62,54,46,.2); animation:slidein .2s ease; }
.modal h3 { font-size:15px; font-weight:700; margin-bottom:14px; color:var(--text); }
.modal .form-group { margin-bottom:12px; }
.modal .form-group label { display:block; font-size:11px; color:var(--muted);
  font-weight:600; margin-bottom:4px; }
.modal .form-group input, .modal .form-group select {
  width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
  border-radius:8px; padding:8px 10px; font-size:13px; }
.modal .form-group input:focus, .modal .form-group select:focus {
  outline:none; border-color:var(--primary); }
.modal .form-row { display:flex; gap:10px; }
.modal .form-row .form-group { flex:1; }
.modal .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.modal .tabs { display:flex; gap:2px; border-bottom:2px solid var(--border); margin-bottom:14px; }
.modal .tabs button { background:none; border:none; padding:8px 14px; font-size:12px;
  font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent;
  margin-bottom:-2px; }
.modal .tabs button.active { color:var(--primary); border-bottom-color:var(--primary); }
@keyframes fadein { from{opacity:0} to{opacity:1} }
@keyframes slidein { from{transform:translateY(10px);opacity:0} to{transform:translateY(0);opacity:1} }

/* ---- Mobile ---- */
.hamburger { display:none !important; background:none; border:none; font-size:22px;
  cursor:pointer; color:var(--text); padding:4px 8px; }
@media(max-width:768px) {
  .sidebar { position:fixed; left:-240px; top:0; z-index:50; transition:left .3s ease;
    box-shadow:4px 0 20px rgba(0,0,0,.2); }
  .sidebar.open { left:0; }
  .main { margin-left:0; padding:16px 12px; }
  .hamburger { display:block !important; }
  .kpis { grid-template-columns:1fr 1fr; }
  .grid2 { grid-template-columns:1fr; }
}
.sidebar-overlay { position:fixed; inset:0; background:rgba(62,54,46,.35); z-index:40; }

</style>
</head>
<body>
  <div id="main"></div>
</body>
</html>
