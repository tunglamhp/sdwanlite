[workspace]

[package]
name = "sdwanlite-web"
version = "1.2.0"
edition = "2021"
license = "MIT"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.6"
gloo-timers = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "Performance"] }

[profile.release]
opt-level = "s"
