[package]
name = "sdwanlite-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sdwanlited"
path = "src/main.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[dependencies]
sdwanlite-core = { path = "../core" }
sdwanlite-lb = { path = "../lb" }
serde_json = "1"
base64 = "0.22"
tower-http = { version = "0.6", features = ["fs"] }
tokio-stream = "0.1"
futures-core = "0.3"
futures-util = "0.3"
sdwanlite-mesh = { path = "../mesh" }
sdwanlite-bgp = { path = "../bgp" }
sdwanlite-acme = { path = "../acme" }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
