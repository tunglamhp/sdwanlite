name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace
      - name: Release build
        run: cargo build --release

  auto-fix:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Auto-fix
        run: bash scripts/auto-fix.sh
      - name: Commit fixes
        run: |
          git config user.name "sdwan-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "No fixes to commit"
          else
            git add -A
            git commit -m "chore: auto-fix lint/format issues [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      - name: Require GH_PAT
        if: ${{ ! secrets.GH_PAT }}
        run: |
          echo "::error::Missing required secret GH_PAT with repo scope for auto-fix push."
          exit 1

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run
