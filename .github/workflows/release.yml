name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            agent: sdwan-agent
            app: sdwanlited
            archive: sdwanlite-${{ github.ref_name }}-linux-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            agent: sdwan-agent.exe
            app: sdwanlited.exe
            archive: sdwanlite-${{ github.ref_name }}-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (linux)
        if: runner.os == 'Linux'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.agent }} ${{ matrix.app }}
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.agent }}","target/${{ matrix.target }}/release/${{ matrix.app }}" -DestinationPath "${{ matrix.archive }}"
      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ matrix.archive }}
